# Принятые находки сканирования doc-convert (images/publish.sh, FTR.NAB.CHAT-0003
# tech, решение 26): бинарники gotenberg и pdfcpu из образа Gotenberg 8.38.1
# собраны на Go 1.27.1 со старыми модулями. Пакеты Debian обновляет apt-get
# upgrade при сборке, их здесь нет. После expired_at находка снова блокирует
# выпуск: к этому сроку — исправленный Gotenberg или пересборка бинарников.
#
# Почему это допустимо сейчас: у doc-convert нет исходящей сети (сетевые
# политики, флаги --*-deny-private-ips/--*-deny-public-ips), вход — только от
# docgen и api Nabu с базовой аутентификацией; Gotenberg не обслуживает
# WebSocket, не ходит по TLS наружу и не использует SSH.

vulnerabilities:
  # labstack/echo/v5 5.4.0 → 5.4.1: обход доступа и удержание соединений при WebSocket
  - id: GHSA-cxf3-9h37-7rr8
    paths: [usr/bin/gotenberg]
    statement: Gotenberg не обслуживает WebSocket; вход только от docgen и api с базовой аутентификацией
    expired_at: 2027-01-31
  - id: GHSA-9969-6676-49h5
    paths: [usr/bin/gotenberg]
    statement: Gotenberg не обслуживает WebSocket
    expired_at: 2027-01-31
  # те же находки под номерами CVE: Trivy сопоставляет по id, а не по алиасам
  - id: CVE-2026-118264
    paths: [usr/bin/gotenberg]
    statement: GHSA-cxf3-9h37-7rr8; Gotenberg не обслуживает WebSocket; вход только от docgen и api с базовой аутентификацией
    expired_at: 2027-01-31
  - id: CVE-2026-118262
    paths: [usr/bin/gotenberg]
    statement: GHSA-9969-6676-49h5; Gotenberg не обслуживает WebSocket
    expired_at: 2027-01-31
  # go-jose/v4 4.1.5 → 4.1.6: отказ в обслуживании при разборе JWK с ключами RSA
  - id: CVE-2026-116587
    paths: [usr/bin/gotenberg]
    statement: Вход только с базовой аутентификацией, JWT и JWK doc-convert не разбирает
    expired_at: 2027-01-31
  # стандартная библиотека Go 1.27.1 → 1.27.3 и golang.org/x/net 0.59 → 0.60
  - id: CVE-2026-78669
    paths: [usr/bin/gotenberg, usr/bin/pdfcpu]
    statement: Отказ в обслуживании через HTTP/2; клиенты — только docgen и api внутри кластера
    expired_at: 2027-01-31
  - id: CVE-2026-78667
    paths: [usr/bin/gotenberg, usr/bin/pdfcpu]
    statement: Отказ в обслуживании через заголовок Range; клиенты — только docgen и api внутри кластера
    expired_at: 2027-01-31
  - id: CVE-2026-111943
    paths: [usr/bin/gotenberg, usr/bin/pdfcpu]
    statement: Проверка цепочки x509 при исходящем TLS; у doc-convert нет исходящей сети
    expired_at: 2027-01-31
  - id: CVE-2026-97031
    paths: [usr/bin/gotenberg, usr/bin/pdfcpu]
    statement: ECH в TLS; doc-convert принимает только HTTP внутри кластера и не ходит наружу
    expired_at: 2027-01-31
  # модули pdfcpu 0.15.0
  - id: CVE-2026-56854
    paths: [usr/bin/pdfcpu]
    statement: golang.org/x/crypto/ssh; pdfcpu не использует SSH
    expired_at: 2027-01-31
  - id: CVE-2026-46603
    paths: [usr/bin/pdfcpu]
    statement: Разбор WebP (vp8l); Gotenberg вызывает pdfcpu только для PDF, docgen задаёт лимиты размера
    expired_at: 2027-01-31
  - id: CVE-2026-56851
    paths: [usr/bin/pdfcpu]
    statement: golang.org/x/text, профиль Nickname; отказ в обслуживании одного вызова в изолированном поде
    expired_at: 2027-01-31
