{{- if .Values.search.enabled }}
# Web search (FTR.INFRA.MCPS-0003): one container over the DeepSeek Search and Fetch APIs. The key
# comes from the Secret mcp-deepseek-key, which installer fills from MCP_SEARCH_KEY; the address of
# the API is the setting of the stand. SearXNG and its sidecar are gone with the old server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels: {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/name: search
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: search } }
  template:
    metadata:
      labels: {{- include "mcp.labels" . | nindent 8 }}
        app.kubernetes.io/name: search
      annotations:
        checksum/url: {{ .Values.search.url | sha256sum | trunc 16 }}
        # metrics search_* of the server (the dashboard "MCP servers", the section "Web search")
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      {{- include "mcp.podSecurity" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: search-mcp
          image: {{ .Values.search.image }}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            # the platform key authenticates the caller; the DeepSeek key goes to the vendor (FTR.INFRA.MCPS-0003 R2, R2a)
            - { name: SEARCH_KEY, valueFrom: { secretKeyRef: { name: mcp-search-key, key: key } } }
            - { name: DEEPSEEK_KEY, valueFrom: { secretKeyRef: { name: mcp-deepseek-key, key: key } } }
            - { name: SEARCH_URL, value: {{ .Values.search.url | quote }} }
            - { name: SEARCH_TIMEOUT_SECONDS, value: "30" }
            - { name: SEARCH_MAX_CONTENT_BYTES, value: "102400" }
            - { name: SEARCH_RETRIES, value: "2" }
            - { name: PORT, value: "8000" }
            - { name: HOST, value: "0.0.0.0" }
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.search.resources | nindent 12 }}
          {{- include "mcp.containerSecurity" . | nindent 10 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: search
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: search }
  ports: [{ name: http, port: 3000, targetPort: http }]
{{- end }}
