# MCP servers of the stand (FTR.NAB.CMN-0006, tech §2.5). They are turned on by the options
# MCP_DOCLING, MCP_SEARCH, MCP_YANDEX_MAIL, MCP_DOCGEN; images and versions are in config/versions.env.
# Access keys come from secrets of the namespace (installer creates them).

docling:
  enabled: false
  serve:
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    # Parsing a document on CPU: the models of layout, tables and OCR are in the memory of the process.
    # Measured on prod over 7 days (2026-10-24): CPU p95 2m, peak 12m; memory p95 1085 MiB,
    # peak 1143 MiB. The request follows memory with a margin; parsing runs within the limit of 2 CPU / 4 GiB.
    resources: { requests: { cpu: 100m, memory: 1280Mi }, limits: { cpu: "2", memory: 4Gi } }
    maxFileMB: 25
  mcp:
    image: ghcr.io/greenongrey/docling-mcp:3.3.0
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
    # Languages of recognizing scans (EasyOCR).
    ocrLang: "ru,en"
  auth:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }

# Web search (FTR.INFRA.MCPS-0003): our own server over the DeepSeek Search and Fetch APIs.
# The key is not a value of the chart: installer puts MCP_SEARCH_KEY into the Secret mcp-deepseek-key.
search:
  enabled: false
  image: ghcr.io/greenongrey/search-mcp:0.1.0
  # https:// only: a corporate mirror or proxy is allowed, plain http is not. The loopback http
  # exists for the test of the image alone.
  url: https://api.deepseek.com
  resources: { requests: { cpu: 20m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }

yandexMail:
  enabled: false
  # Our own read-only IMAP server (images/imap-mcp), the tag is its VERSION.
  image: ghcr.io/greenongrey/imap-mcp:0.2.4
  imapHost: imap.yandex.com
  # The link to a message: a search by subject in the mailbox of the user ({uid} — the number of the
  # account, {subject} — the subject without Re:/Fwd:, {msgid} — the Message-ID without angle brackets).
  # IMAP of Yandex gives no internal number of a message (FTR.NAB.CMN-0006 tech, decision 28).
  webLink: "https://mail.yandex.ru/?uid={uid}#/search?request={subject}"
  resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }

# Documents (FTR.NAB.CHAT-0003 tech §2, §3): docgen is an MCP server, doc-convert is
# Gotenberg (LibreOffice and Chromium without a network) with the sidecar legacy.
docgen:
  enabled: false
  image: ghcr.io/greenongrey/docgen-mcp:0.1.5
  resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
  limits: { inlineMB: 4, sourceMB: 25, resultMB: 50, timeoutSeconds: 120, maxPages: 500 }
docConvert:
  image: ghcr.io/greenongrey/doc-convert:0.2.2
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
  legacy:
    resources: { requests: { cpu: 10m, memory: 128Mi }, limits: { cpu: "1", memory: 1Gi } }
  # Queues of conversions; beyond them, 503 "service busy".
  queue: 10

# Personal servers (FTR.INFRA.MCPS-0001): the token of the user arrives in every request from the
# proxy of Nabu, the servers store nothing and expose read-only tools. An address is a setting of
# the stand, not of a user: one product of one stand has one address (tech §3).
# cloud | dc: Cloud signs users in by OAuth 2.0 (3LO), Data Center by a personal access token.
jira:
  enabled: false
  image: ghcr.io/greenongrey/atlassian-mcp:0.1.1
  url: ""
  authMode: cloud
  cloudId: ""
  # Secret of the namespace with ca.crt of the company CA, if the system has a private certificate.
  caSecret: ""
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
confluence:
  enabled: false
  image: ghcr.io/greenongrey/atlassian-mcp:0.1.1
  url: ""
  authMode: cloud
  cloudId: ""
  caSecret: ""
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
gitlab:
  enabled: false
  image: ghcr.io/greenongrey/gitlab-mcp:0.1.0
  # The address of the instance, not of the API: the server appends /api/v4.
  url: ""
  caSecret: ""
  resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
clickhouse:
  enabled: false
  image: ghcr.io/greenongrey/clickhouse-mcp:0.1.1
  host: ""
  port: 8443
  secure: true
  caSecret: ""
  # readonly=1 goes with every query; these two bound the price of a mistake of the model.
  limits: { querySeconds: 30, maxRows: 10000 }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
greenplum:
  enabled: false
  # FTR.INFRA.MCPS-0002: our own server (images/greenplum-mcp). The user connects with the login and
  # password of a Greenplum user; the session is read-only, statement_timeout and the row limit come
  # from limits below.
  image: ghcr.io/greenongrey/greenplum-mcp:0.1.1
  host: ""           # the master of Greenplum, required when enabled
  port: 5432
  database: citydrive_db
  # prefer | require | verify-ca | verify-full; the last two together with caSecret
  sslmode: prefer
  caSecret: ""
  limits: { querySeconds: 30, maxRows: 10000 }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }

# Who calls the servers: components of Nabu (app.kubernetes.io/name=nabu) and the checks of the stand.
# api is the MCP proxy for agents, worker is the collector of the memory of communications, agent is
# the check of a connection in the catalog.
callers:
  namespace: nabu
  name: nabu
  components: [api, worker, agent]
# Networks of the company the servers reach besides the internet, as CIDRs: the private ranges are closed to the
# servers by default (FTR.INFRA.INST-0001 R21). An administrator names them: such as [10.20.30.0/24]. The web
# search goes through DeepSeek and does not use the list (FTR.INFRA.MCPS-0003 R7).
egressAllow: []
# S3 of the stand: copies of workspace files for document parsing (R14).
s3:
  namespace: storages
  ports: [9000, 8333]

imagePullSecrets: [{ name: ghcr-pull }]
