# MCP-серверы стенда (FTR.NAB.CMN-0006, tech §2.5). Включение — опциями
# MCP_DOCLING, MCP_SEARCH, MCP_YANDEX_MAIL, MCP_DOCGEN; образы и версии — config/versions.env.
# Ключи доступа приходят из секретов namespace (их создаёт installer).

docling:
  enabled: false
  serve:
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    # Разбор документа на CPU: модели раскладки, таблиц и OCR в памяти процесса.
    # Замер на проде за 7 дней (2026-10-24): CPU p95 2m, пик 12m; память p95 1085 МиБ,
    # пик 1143 МиБ. Запрос — по памяти с запасом; разбор идёт в лимите 2 CPU / 4 ГиБ.
    resources: { requests: { cpu: 100m, memory: 1280Mi }, limits: { cpu: "2", memory: 4Gi } }
    maxFileMB: 25
  mcp:
    image: ghcr.io/greenongrey/docling-mcp:3.3.0
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
    # Языки распознавания сканов (EasyOCR).
    ocrLang: "ru,en"
  auth:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }

search:
  enabled: false
  mcp:
    image: isokoliuk/mcp-searxng:2.6.0
    resources: { requests: { cpu: 20m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
  searxng:
    image: searxng/searxng:2026.10.11-ad46ebd7d
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  # Поисковые системы SearXNG (решение 3: без Google — он быстрее всех блокирует IP дата-центра).
  engines: [duckduckgo, bing, brave, wikipedia, github, stackoverflow, arxiv]

yandexMail:
  enabled: false
  # Собственный сервер IMAP только для чтения (images/imap-mcp), тег — его VERSION.
  image: ghcr.io/greenongrey/imap-mcp:0.2.2
  imapHost: imap.yandex.com
  # Ссылка на письмо: поиск по Message-ID в веб-интерфейсе ({msgid} — без угловых скобок).
  webLink: "https://mail.yandex.ru/#search?request={msgid}"
  resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }

# Документы (FTR.NAB.CHAT-0003 tech §2, §3): docgen — MCP-сервер, doc-convert —
# Gotenberg (LibreOffice и Chromium без сети) и сайдкар legacy.
docgen:
  enabled: false
  image: ghcr.io/greenongrey/docgen-mcp:0.1.3
  resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
  limits: { inlineMB: 4, sourceMB: 25, resultMB: 50, timeoutSeconds: 120, maxPages: 500 }
docConvert:
  image: ghcr.io/greenongrey/doc-convert:0.1.0
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
  legacy:
    resources: { requests: { cpu: 10m, memory: 128Mi }, limits: { cpu: "1", memory: 1Gi } }
  # Очереди конвертаций; сверх них — 503 «сервис занят».
  queue: 10

# Кто вызывает серверы: компоненты Nabu (app.kubernetes.io/name=nabu) и проверки стенда.
# api — прокси MCP для агентов, worker — сборщик памяти коммуникаций, agent —
# проверка подключения в каталоге.
callers:
  namespace: nabu
  name: nabu
  components: [api, worker, agent]
# S3 стенда: копии файлов пространства для разбора документов (R14).
s3:
  namespace: storages
  ports: [9000, 8333]

imagePullSecrets: [{ name: ghcr-pull }]
