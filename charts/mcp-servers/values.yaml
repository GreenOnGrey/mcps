# MCP servers of the stand (FTR.NAB.CMN-0006, tech §2.5). They are turned on by the options
# MCP_DOCLING, MCP_SEARCH, MCP_YANDEX_MAIL, MCP_DOCGEN; images and versions are in config/versions.env.
# Access keys come from secrets of the namespace (installer creates them).

docling:
  enabled: false
  serve:
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    # Parsing a document on CPU: the models of layout, tables and OCR are in the memory of the process.
    # Measured on prod over 7 days (2026-10-24): CPU p95 2m, peak 12m; memory p95 1085 MiB,
    # peak 1143 MiB. The request follows memory with a margin; parsing runs within the limit of 2 CPU / 4 GiB.
    resources: { requests: { cpu: 100m, memory: 1280Mi }, limits: { cpu: "2", memory: 4Gi } }
    maxFileMB: 25
  mcp:
    image: ghcr.io/greenongrey/docling-mcp:3.3.0
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
    # Languages of recognizing scans (EasyOCR).
    ocrLang: "ru,en"
  auth:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }

search:
  enabled: false
  mcp:
    image: isokoliuk/mcp-searxng:2.6.0
    resources: { requests: { cpu: 20m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
  searxng:
    image: searxng/searxng:2026.10.11-ad46ebd7d
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  # Search engines of SearXNG (decision 3: no Google, which blocks data center IPs fastest).
  engines: [duckduckgo, bing, brave, wikipedia, github, stackoverflow, arxiv]

yandexMail:
  enabled: false
  # Our own read-only IMAP server (images/imap-mcp), the tag is its VERSION.
  image: ghcr.io/greenongrey/imap-mcp:0.2.2
  imapHost: imap.yandex.com
  # The link to a message: a search by Message-ID in the web interface ({msgid} has no angle brackets).
  webLink: "https://mail.yandex.ru/#search?request={msgid}"
  resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }

# Documents (FTR.NAB.CHAT-0003 tech §2, §3): docgen is an MCP server, doc-convert is
# Gotenberg (LibreOffice and Chromium without a network) with the sidecar legacy.
docgen:
  enabled: false
  image: ghcr.io/greenongrey/docgen-mcp:0.1.3
  resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
  limits: { inlineMB: 4, sourceMB: 25, resultMB: 50, timeoutSeconds: 120, maxPages: 500 }
docConvert:
  image: ghcr.io/greenongrey/doc-convert:0.1.0
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
  legacy:
    resources: { requests: { cpu: 10m, memory: 128Mi }, limits: { cpu: "1", memory: 1Gi } }
  # Queues of conversions; beyond them, 503 "service busy".
  queue: 10

# Who calls the servers: components of Nabu (app.kubernetes.io/name=nabu) and the checks of the stand.
# api is the MCP proxy for agents, worker is the collector of the memory of communications, agent is
# the check of a connection in the catalog.
callers:
  namespace: nabu
  name: nabu
  components: [api, worker, agent]
# S3 of the stand: copies of workspace files for document parsing (R14).
s3:
  namespace: storages
  ports: [9000, 8333]

imagePullSecrets: [{ name: ghcr-pull }]
